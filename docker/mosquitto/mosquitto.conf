persistence true
persistence_location /mosquitto/data/

log_dest stdout

# 초기 현장 설치용 기본 구성이다. 외부 센서가 접속하면 방화벽으로 1883 접근 대상을 제한한다.
# MQTT 계정 기반 인증은 별도 보안 작업에서 password_file과 함께 적용한다.
listener 1883
allow_anonymous true

# 브라우저 실시간 텔레메트리 페이지의 MQTT-over-WebSocket 구독용 리스너
listener 9001
protocol websockets
