<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DCIM Live Telemetry</title>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.4/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #090e17;
      --panel: #121a29;
      --panel-2: #182235;
      --line: #2a3a52;
      --text: #e7edf8;
      --muted: #93a7c1;
      --accent: #35bdf4;
      --ok: #47d58c;
      --warn: #ffbd54;
      --bad: #ff6274;
      --chip: #1c2a40;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: radial-gradient(circle at 78% -20%, #17365a 0, transparent 34%), var(--bg); color: var(--text); font-family: Pretendard, "Segoe UI", "Malgun Gothic", sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr; }
    header {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      min-height:64px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: rgba(13,20,33,.96); box-shadow:0 5px 18px rgba(0,0,0,.16);
    }
    h1 { font-size: 16px; margin: 0; font-weight: 750; letter-spacing: .02em; }
    h1::before { content:"D"; display:inline-grid; place-items:center; width:28px; height:28px; margin-right:9px; border-radius:6px; color:#06111c; background:linear-gradient(135deg,#4cd4ff,#2498df); font-weight:900; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    label { font-size: 12px; color: var(--muted); }
    input, button, select {
      background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
      border-radius: 6px; padding: 7px 10px; font-size: 13px;
    }
    input { min-width: 140px; }
    button { cursor: pointer; background: linear-gradient(135deg,#159ad0,#287ee0); border-color:#2aa6dd; color:#fff; font-weight:700; }
    button.ghost { background:#172337; color:var(--text); border-color:#334861; }
    button.danger { background: #c94c53; color: #fff; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); display: inline-block; }
    .dot.on { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    main { display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
    aside {
      border-right: 1px solid var(--line); background: rgba(12,18,29,.9);
      overflow: auto; padding: 12px;
    }
    .panel-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 8px; }
    .device {
      background: linear-gradient(145deg,#182338,#111a29); border: 1px solid var(--line); border-radius: 8px;
      padding: 10px; margin-bottom: 8px;
    }
    .device h3 { margin: 0 0 4px; font-size: 14px; }
    .meta { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
    .point { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
    .point input { min-width: 0; }
    .charts {
      overflow: auto; padding: 12px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 12px;
      align-content: start;
    }
    .chart-card {
      background: linear-gradient(145deg,#182338,#111a29); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
      min-height: 260px;
    }
    .chart-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .chart-head strong { font-size: 13px; }
    .chart-head span { font-size: 22px; font-variant-numeric: tabular-nums; color: var(--accent); }
    .unit { color: var(--muted); font-size: 12px; margin-left: 4px; }
    canvas { width: 100% !important; height: 200px !important; }
    .log {
      grid-column: 1 / -1; background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; padding: 10px; font-family: Consolas, monospace; font-size: 12px;
      max-height: 160px; overflow: auto; color: var(--muted); white-space: pre-wrap;
    }
    .empty { color: var(--muted); padding: 40px 12px; text-align: center; }
    .chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 2px 8px; font-size: 11px; }

    /* Live telemetry workspace */
    header.live-header { display:block; min-height:0; padding:0; border:0; }
    .live-topbar { min-height:68px; display:flex; align-items:center; gap:14px; padding:10px 22px; border-bottom:1px solid var(--line); background:#0d1522; }
    .live-brand { display:flex; align-items:center; gap:11px; min-width:230px; }
    .live-mark { width:36px; height:36px; display:grid; place-items:center; border-radius:9px; color:#06111c; background:linear-gradient(135deg,#4cd4ff,#2498df); font-weight:900; }
    .live-brand strong { display:block; font-size:14px; letter-spacing:.12em; }
    .live-brand span { display:block; margin-top:2px; color:var(--muted); font-size:10px; letter-spacing:.08em; }
    .live-context { flex:1; padding-left:18px; border-left:1px solid var(--line); }
    .live-context small { display:block; color:#6f87a4; font-size:10px; letter-spacing:.12em; }
    .live-context h1 { margin:2px 0 0; font-size:17px; }
    .live-context h1::before { display:none; }
    .live-nav { display:flex; align-items:center; gap:8px; }
    .live-nav a { padding:8px 11px; border:1px solid var(--line); border-radius:8px; color:var(--text); background:#162235; text-decoration:none; font-size:12px; font-weight:700; }
    .live-config { display:grid; grid-template-columns:1.5fr 1fr 1fr; gap:12px; padding:14px 22px; border-bottom:1px solid var(--line); background:#101a29; }
    .live-config-group { min-width:0; padding:12px; border:1px solid #263951; border-radius:10px; background:#131f30; }
    .live-config-title { margin:0 0 9px; color:#7f96b0; font-size:10px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; }
    .live-field { flex:1; min-width:110px; }
    .live-field label { display:block; margin-bottom:5px; }
    .live-field input { width:100%; min-width:0; }
    .session-status { min-height:36px; display:flex; align-items:center; gap:8px; flex:1; padding:7px 10px; border:1px solid #2a3a52; border-radius:8px; background:#0e1928; color:#b9c9da; font-size:12px; }
    main { grid-template-columns:360px minmax(0,1fr); background:#090f19; }
    aside { padding:18px; background:#0d1624; }
    .target-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .target-head .panel-title { margin:0 0 4px; color:var(--text); font-size:16px; letter-spacing:0; text-transform:none; }
    .target-head p { margin:0; color:var(--muted); font-size:11px; }
    .target-actions { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:14px; }
    .target-actions #reloadBtn { grid-column:1/-1; }
    .target-actions button { min-height:35px; }
    .device { padding:12px; border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,.12); }
    .point { min-height:31px; padding:5px 7px; border-radius:6px; }
    .point:hover { background:#1b2a3f; }
    .point input { accent-color:var(--accent); }
    .charts { padding:0 20px 22px; gap:14px; }
    .charts-head { grid-column:1/-1; min-height:72px; display:flex; align-items:center; justify-content:space-between; gap:14px; position:sticky; top:0; z-index:8; margin:0 -20px 2px; padding:12px 20px; border-bottom:1px solid rgba(42,58,82,.75); background:rgba(9,15,25,.91); backdrop-filter:blur(12px); }
    .charts-head strong { display:block; font-size:18px; }
    .charts-head span { display:block; margin-top:3px; color:var(--muted); font-size:11px; }
    .stream-chip { display:inline-flex !important; align-items:center; gap:7px; margin:0 !important; padding:7px 11px; border:1px solid rgba(71,213,140,.25); border-radius:999px; color:var(--ok) !important; background:rgba(71,213,140,.08); font-size:11px !important; font-weight:800; }
    .stream-chip::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
    .chart-card { min-height:290px; padding:14px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.15); }
    .chart-head { padding-bottom:10px; border-bottom:1px solid rgba(42,58,82,.75); }
    .log { margin-top:4px; }
    @media (max-width:1100px) { .live-config { grid-template-columns:1fr 1fr; } .live-config-group:first-child { grid-column:1/-1; } .live-brand { min-width:auto; } .live-brand div { display:none; } }
    @media (max-width:760px) { .live-topbar { padding:10px 12px; } .live-brand { display:none; } .live-context { padding-left:0; border-left:0; } .live-context h1 { font-size:16px; white-space:nowrap; } .live-context small,.live-nav a:first-of-type { display:none; } .live-config { grid-template-columns:1fr; padding:12px; } .live-config-group:first-child { grid-column:auto; } main { grid-template-columns:1fr; overflow:auto; } aside { max-height:48vh; border-right:0; border-bottom:1px solid var(--line); } .charts { overflow:visible; grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header class="live-header">
    <div class="live-topbar"><div class="live-brand"><span class="live-mark">D</span><div><strong>DEFOG</strong><span>DATA CENTER INTELLIGENCE</span></div></div><div class="live-context"><small>REALTIME WORKSPACE</small><h1>실시간 텔레메트리</h1></div><div class="live-nav"><span id="authStatus" class="chip">미로그인</span><a href="/widget-dashboard.html">대시보드</a><a href="/ops-console.html">운영 콘솔 ↗</a></div></div>
    <section class="live-config">
      <div class="live-config-group"><p class="live-config-title">Connection</p><div class="row"><span class="live-field"><label>Manager 서버</label><input id="managerUrl" placeholder="http://localhost:8080" /></span><span class="live-field"><label>MQTT WebSocket</label><input id="mqttUrl" value="ws://localhost:9001/mqtt" /></span><span class="live-field"><label>구독 Topic</label><input id="topic" value="dcim/sensor/realtime" /></span></div></div>
      <div class="live-config-group"><p class="live-config-title">Authentication</p><div class="row"><span class="live-field"><label>아이디</label><input id="username" placeholder="username" /></span><span class="live-field"><label>비밀번호</label><input id="password" type="password" placeholder="password" /></span><button id="loginBtn" type="button">로그인</button></div></div>
      <div class="live-config-group"><p class="live-config-title">Realtime session</p><div class="row"><div class="session-status"><span class="dot" id="mqttDot"></span><span id="mqttStatus">MQTT 미연결</span></div><button id="mqttBtn" class="ghost" type="button">연결</button><button id="applyBtn" type="button">수집 시작</button><button id="stopBtn" class="danger" type="button">중지</button></div></div>
  </header>
  <main>
    <aside>
      <div class="target-head"><div><p class="panel-title">측정 대상 선택</p><p>실시간으로 확인할 장비와 Point를 고르세요.</p></div><span id="selectedCount" class="chip">0 선택</span></div>
      <div class="target-actions">
        <button id="reloadBtn" class="ghost" type="button">목록 새로고침</button>
        <button id="allBtn" class="ghost" type="button">전체 선택</button>
        <button id="noneBtn" class="ghost" type="button">선택 해제</button>
      </div>
      <div id="devices"><p class="empty">로그인 후 목록을 불러오세요.</p></div>
    </aside>
    <section class="charts" id="charts">
      <div class="charts-head"><div><strong>Live signal</strong><span>수집 중인 Point의 최근 90개 값을 확인합니다.</span></div><span class="stream-chip">STREAM READY</span></div>
      <p class="empty" id="chartEmpty">point를 고른 뒤 수집을 시작하면 그래프가 생깁니다.</p>
      <div class="log" id="log"></div>
    </section>
  </main>
  <script>
    const MAX_POINTS = 90;
    const PALETTE = ["#3d9cf0", "#3ecf8e", "#f0b429", "#c084fc", "#f07178", "#67e8f9", "#fb923c", "#a3e635"];
    const state = {
      token: sessionStorage.getItem("liveToken") || "",
      mqtt: null,
      charts: new Map(),
      devices: [],
    };

    const $ = (id) => document.getElementById(id);

    function defaultManagerUrl() {
      if (location.protocol.startsWith("http") && location.port === "8080") return "";
      return "http://localhost:8080";
    }

    $("managerUrl").value = localStorage.getItem("liveManagerUrl") ?? defaultManagerUrl();
    $("mqttUrl").value = localStorage.getItem("liveMqttUrl") || "ws://localhost:9001/mqtt";
    $("topic").value = localStorage.getItem("liveTopic") || "dcim/sensor/realtime";

    function managerBase() {
      return $("managerUrl").value.replace(/\/$/, "");
    }

    function log(line) {
      const el = $("log");
      const ts = new Date().toLocaleTimeString();
      el.textContent = `[${ts}] ${line}\n` + el.textContent;
      if (el.textContent.length > 8000) el.textContent = el.textContent.slice(0, 8000);
    }

    function setAuthStatus() {
      $("authStatus").textContent = state.token ? "로그인됨" : "미로그인";
    }

    async function api(path, options = {}) {
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      if (state.token) headers.Authorization = "Bearer " + state.token;
      const res = await fetch(managerBase() + path, { ...options, headers });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(json.error || json.message || `HTTP ${res.status}`);
      }
      return json.data;
    }

    async function login() {
      const username = $("username").value.trim();
      const password = $("password").value;
      const data = await api("/api/manager/auth/login", {
        method: "POST",
        body: JSON.stringify({ username, password }),
      });
      state.token = data.accessToken;
      sessionStorage.setItem("liveToken", state.token);
      setAuthStatus();
      log("로그인 성공: " + data.username);
      await loadDevices();
    }

    function selectedItems() {
      const items = [];
      for (const device of state.devices) {
        const names = [];
        for (const point of device.points || []) {
          const box = document.querySelector(`input[data-key="${device.deviceId}::${point.name}"]`);
          if (box && box.checked) names.push(point.name);
        }
        if (names.length) items.push({ deviceId: device.deviceId, pointNames: names });
      }
      return items;
    }

    function renderDevices() {
      if (!state.devices.length) {
        $("devices").innerHTML = '<p class="empty">선택 가능한 SNMP 장비가 없습니다.</p>';
        return;
      }
      $("devices").innerHTML = state.devices.map((device) => `
        <article class="device">
          <h3>${escapeHtml(device.deviceName || ("device-" + device.deviceId))}</h3>
          <div class="meta">#${device.deviceId} · ${escapeHtml(device.modelName || "-")} · ${escapeHtml(device.locationNodeName || "-")}</div>
          ${(device.points || []).map((point) => `
            <label class="point">
              <input type="checkbox" data-key="${device.deviceId}::${point.name}" />
              <span>${escapeHtml(point.name)}</span>
              <span class="chip">${escapeHtml(point.unit || "")}</span>
            </label>
          `).join("")}
        </article>
      `).join("");
      updateSelectedCount();
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    async function loadDevices() {
      localStorage.setItem("liveManagerUrl", $("managerUrl").value);
      state.devices = await api("/api/manager/live/devices") || [];
      renderDevices();
      log("장비 " + state.devices.length + "대 로드");
      try {
        const selection = await api("/api/manager/live/selection");
        applyChecks(selection && selection.items ? selection.items : []);
      } catch (err) {
        log("현재 선택 조회 실패: " + err.message);
      }
    }

    function applyChecks(items) {
      document.querySelectorAll("input[data-key]").forEach((el) => { el.checked = false; });
      for (const item of items) {
        for (const name of item.pointNames || []) {
          const box = document.querySelector(`input[data-key="${item.deviceId}::${name}"]`);
          if (box) box.checked = true;
        }
      }
      updateSelectedCount();
      ensureCharts(selectedKeys());
    }

    function selectedKeys() {
      return [...document.querySelectorAll("input[data-key]:checked")].map((el) => el.dataset.key);
    }

    function setAll(checked) {
      document.querySelectorAll("input[data-key]").forEach((el) => { el.checked = checked; });
      updateSelectedCount();
    }

    function updateSelectedCount() {
      $("selectedCount").textContent = `${selectedKeys().length} 선택`;
    }

    async function applySelection() {
      const items = selectedItems();
      const result = await api("/api/manager/live/selection", {
        method: "PUT",
        body: JSON.stringify({ items }),
      });
      ensureCharts(selectedKeys());
      log("수집 시작. 만료: " + (result && result.expiresAt ? result.expiresAt : "-"));
      connectMqtt();
    }

    async function stopSelection() {
      await api("/api/manager/live/selection", { method: "DELETE" });
      document.querySelectorAll("input[data-key]").forEach((el) => { el.checked = false; });
      updateSelectedCount();
      log("수집 중지");
    }

    function connectMqtt() {
      localStorage.setItem("liveMqttUrl", $("mqttUrl").value);
      localStorage.setItem("liveTopic", $("topic").value);
      if (state.mqtt) {
        try { state.mqtt.end(true); } catch (_) { /* ignore */ }
        state.mqtt = null;
      }
      $("mqttStatus").textContent = "MQTT 연결 중...";
      $("mqttDot").className = "dot warn";
      const client = mqtt.connect($("mqttUrl").value.trim(), {
        clientId: "live-html-" + Math.random().toString(16).slice(2),
        reconnectPeriod: 2000,
        connectTimeout: 8000,
        clean: true,
      });
      state.mqtt = client;
      client.on("connect", () => {
        $("mqttStatus").textContent = "MQTT 연결됨";
        $("mqttDot").className = "dot on";
        client.subscribe($("topic").value.trim(), (err) => {
          if (err) log("구독 실패: " + err.message);
          else log("구독: " + $("topic").value.trim());
        });
      });
      client.on("reconnect", () => {
        $("mqttStatus").textContent = "MQTT 재연결 중";
        $("mqttDot").className = "dot warn";
      });
      client.on("close", () => {
        $("mqttStatus").textContent = "MQTT 끊김";
        $("mqttDot").className = "dot";
      });
      client.on("error", (err) => log("MQTT 오류: " + err.message));
      client.on("message", (_topic, payload) => onMessage(payload.toString()));
    }

    function onMessage(raw) {
      let msg;
      try { msg = JSON.parse(raw); } catch (_) {
        log("JSON 아님: " + raw);
        return;
      }
      if (msg.type && msg.type !== "realtime") return;
      const key = msg.deviceId + "::" + msg.pointName;
      pushSample(key, msg);
    }

    function ensureCharts(keys) {
      $("chartEmpty").style.display = keys.length ? "none" : "block";
      for (const key of state.charts.keys()) {
        if (!keys.includes(key)) {
          const entry = state.charts.get(key);
          entry.chart.destroy();
          entry.card.remove();
          state.charts.delete(key);
        }
      }
      keys.forEach((key, index) => {
        if (!state.charts.has(key)) createChart(key, PALETTE[index % PALETTE.length]);
      });
    }

    function createChart(key, color) {
      const [deviceId, pointName] = key.split("::");
      const device = state.devices.find((d) => String(d.deviceId) === String(deviceId));
      const point = device && (device.points || []).find((p) => p.name === pointName);
      const card = document.createElement("article");
      card.className = "chart-card";
      card.innerHTML = `
        <div class="chart-head">
          <strong>${escapeHtml((device && device.deviceName) || ("device " + deviceId))} · ${escapeHtml(pointName)}</strong>
          <div><span data-value>--</span><span class="unit">${escapeHtml((point && point.unit) || "")}</span></div>
        </div>
        <canvas></canvas>
      `;
      $("charts").insertBefore(card, $("log"));
      const chart = new Chart(card.querySelector("canvas"), {
        type: "line",
        data: {
          labels: [],
          datasets: [{
            data: [],
            borderColor: color,
            backgroundColor: color + "33",
            fill: true,
            tension: 0.25,
            pointRadius: 0,
            borderWidth: 2,
          }],
        },
        options: {
          animation: false,
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: "#8b98a8", maxTicksLimit: 6 }, grid: { color: "#2a3544" } },
            y: { ticks: { color: "#8b98a8" }, grid: { color: "#2a3544" } },
          },
        },
      });
      state.charts.set(key, { chart, card, valueEl: card.querySelector("[data-value]") });
    }

    function pushSample(key, msg) {
      if (!state.charts.has(key)) {
        const keys = [...new Set([...selectedKeys(), key])];
        ensureCharts(keys);
      }
      const entry = state.charts.get(key);
      if (!entry) return;
      const received = new Date();
      const label = received.toLocaleTimeString("ko-KR", { hour12: false }) +
        "." + String(received.getMilliseconds()).padStart(3, "0");
      const value = Number(msg.value);
      const data = entry.chart.data;
      data.labels.push(label);
      data.datasets[0].data.push(Number.isFinite(value) ? value : null);
      if (data.labels.length > MAX_POINTS) {
        data.labels.shift();
        data.datasets[0].data.shift();
      }
      entry.valueEl.textContent = Number.isFinite(value) ? value : String(msg.value);
      const head = entry.card.querySelector("strong");
      if (msg.displayName) {
        head.textContent = msg.displayName + " · " + msg.pointName;
      }
      entry.chart.update("none");
    }

    $("loginBtn").addEventListener("click", () => login().catch((err) => log("로그인 실패: " + err.message)));
    $("reloadBtn").addEventListener("click", () => loadDevices().catch((err) => log("목록 실패: " + err.message)));
    $("allBtn").addEventListener("click", () => setAll(true));
    $("noneBtn").addEventListener("click", () => setAll(false));
    $("applyBtn").addEventListener("click", () => applySelection().catch((err) => log("적용 실패: " + err.message)));
    $("stopBtn").addEventListener("click", () => stopSelection().catch((err) => log("중지 실패: " + err.message)));
    $("mqttBtn").addEventListener("click", connectMqtt);
    $("devices").addEventListener("change", (event) => {
      if (event.target.matches("input[data-key]")) updateSelectedCount();
    });

    setAuthStatus();
    connectMqtt();
    if (state.token) {
      loadDevices().catch((err) => log("목록 실패: " + err.message));
    }
  </script>
</body>
</html>
