spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    out-of-order: false
    locations: classpath:db/migration
  datasource:
    url: jdbc:mariadb://${MARIADB_HOST}:${MARIADB_PORT}/dcim
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties.hibernate:
      format_sql: false
      use_sql_comment: true
      jdbc.time_zone: UTC
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${ACCESS_TOKEN_EXPIRATION}
  refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION}

influx:
  enabled: ${INFLUX_ENABLED:false}
  url: ${INFLUX_URL:http://localhost:8086}
  token: ${INFLUX_TOKEN:}
  org: ${INFLUX_ORG:vivans}
  bucket: ${INFLUX_BUCKET:dcim}
  measurement: ${INFLUX_MEASUREMENT:dcim_sensor}

# 운영에서는 API 문서를 기본으로 공개하지 않는다(SWAGGER_ENABLED=true로 켤 수 있음).
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
