spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:mariadb://${MARIADB_HOST}:${MARIADB_PORT}/dcim
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties.hibernate:
      format_sql: true
      use_sql_comment: true
      jdbc.time_zone: UTC
    open-in-view: false

management:
  influx:
    metrics:
      export:
        enabled: false

influx:
  enabled: ${INFLUX_ENABLED:true}
  url: ${INFLUX_URL}
  token: ${INFLUX_TOKEN}
  org: ${INFLUX_ORG:vivans}
  bucket: ${INFLUX_BUCKET:dcim}
  measurement: ${INFLUX_MEASUREMENT:dcim_sensor}
