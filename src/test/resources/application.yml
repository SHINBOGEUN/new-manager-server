spring:
  application:
    name: new-manager-server
  profiles:
    active: local
server:
  port: 8080

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  file:
    name: ${LOG_FILE_NAME:./logs/application.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE_NAME:./logs/application}.%d{yyyy-MM-dd}.%i.log
      max-file-size: ${LOG_MAX_FILE_SIZE:10MB}
      max-history: ${LOG_MAX_HISTORY:30}
      total-size-cap: ${LOG_TOTAL_SIZE:1GB}

app:
  version: "1.0.2-new-TEST"

jwt:
  secret: ${JWT_SECRET:dGVzdC1vbmx5LXNpZ25pbmcta2V5LW5ldmVyLXVzZS1pbi1wcm9kdWN0aW9u}
  access-token-expiration: ${ACCESS_TOKEN_EXPIRATION:3600}
  refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:7200}

manager:
  inbound:
    service-api-key: test-collector-service-key

security:
  auth-enabled: true

collector:
  service:
    url: http://127.0.0.1:1
    enabled: false

sensor-data:
  service:
    url: http://127.0.0.1:1

operations:
  health:
    mqtt-host: 127.0.0.1

live:
  telemetry:
    session-timeout-minutes: 30
