spring:
  datasource:
    url: jdbc:mariadb://${MARIADB_HOST}:${MARIADB_PORT}/dcim_new
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties.hibernate:
      format_sql: true
      use_sql_comment: true
      jdbc.time_zone: UTC
    open-in-view: false

influx:
  enabled: false
  url: http://localhost:8086
  org: vivans
  bucket: dcim
  measurement: dcim_sensor
