name: Deploy selected services

on:
  workflow_dispatch:
    inputs:
      deploy_manager:
        description: Deploy Manager
        required: false
        type: boolean
        default: false
      deploy_collector:
        description: Deploy Collector
        required: false
        type: boolean
        default: false
      deploy_sensor_data:
        description: Deploy Sensor Data
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dcim-production-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch and a selected service
        env:
          DEPLOY_MANAGER: ${{ inputs.deploy_manager }}
          DEPLOY_COLLECTOR: ${{ inputs.deploy_collector }}
          DEPLOY_SENSOR_DATA: ${{ inputs.deploy_sensor_data }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          if [[ "$DEPLOY_MANAGER" != true && "$DEPLOY_COLLECTOR" != true && "$DEPLOY_SENSOR_DATA" != true ]]; then
            echo 'Select at least one service to deploy.' >&2
            exit 1
          fi

      - name: Checkout Manager
        uses: actions/checkout@v4
        with:
          path: manager
          persist-credentials: false

      - name: Checkout Collector
        uses: actions/checkout@v4
        with:
          repository: SHINBOGEUN/new-collector-server
          ref: main
          path: collector
          persist-credentials: false

      - name: Checkout Sensor Data
        uses: actions/checkout@v4
        with:
          repository: SHINBOGEUN/new-sensor-data-server
          ref: main
          path: sensor-data
          persist-credentials: false

      - name: Read Maven project versions
        id: versions
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import xml.etree.ElementTree as ET

          for key, path in (("manager", "manager/pom.xml"),
                            ("collector", "collector/pom.xml"),
                            ("sensor_data", "sensor-data/pom.xml")):
              root = ET.parse(path).getroot()
              namespace = root.tag.split("}", 1)[0] + "}" if "}" in root.tag else ""
              version = root.findtext(f"{namespace}version")
              if not version or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", version):
                  raise SystemExit(f"Missing or invalid project version in {path}")
              print(f"{key}={version}")
          PY

      - name: Set up JDK 17
        if: ${{ inputs.deploy_manager || inputs.deploy_collector || inputs.deploy_sensor_data }}
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            manager/pom.xml
            collector/pom.xml
            sensor-data/pom.xml

      - name: Build and test Manager
        if: ${{ inputs.deploy_manager }}
        working-directory: manager
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Build and test Collector
        if: ${{ inputs.deploy_collector }}
        working-directory: collector
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Build and test Sensor Data
        if: ${{ inputs.deploy_sensor_data }}
        working-directory: sensor-data
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Assemble selected versioned bundle
        env:
          DEPLOY_MANAGER: ${{ inputs.deploy_manager }}
          DEPLOY_COLLECTOR: ${{ inputs.deploy_collector }}
          DEPLOY_SENSOR_DATA: ${{ inputs.deploy_sensor_data }}
          MANAGER_VERSION: ${{ steps.versions.outputs.manager }}
          COLLECTOR_VERSION: ${{ steps.versions.outputs.collector }}
          SENSOR_DATA_VERSION: ${{ steps.versions.outputs.sensor_data }}
        run: |
          set -euo pipefail
          mkdir -p bundle
          services=()
          if [[ "$DEPLOY_MANAGER" == true ]]; then
            cp "manager/target/new-manager-server-${MANAGER_VERSION}.jar" bundle/manager.jar
            services+=(manager-server)
          fi
          if [[ "$DEPLOY_COLLECTOR" == true ]]; then
            cp "collector/target/new-collector-server-${COLLECTOR_VERSION}.jar" bundle/collector.jar
            services+=(collector-service)
          fi
          if [[ "$DEPLOY_SENSOR_DATA" == true ]]; then
            cp "sensor-data/target/new-sensor-data-server-${SENSOR_DATA_VERSION}.jar" bundle/sensor-data.jar
            services+=(sensor-data-service)
          fi
          cp manager/scripts/deploy-three-services.sh bundle/
          {
            printf 'manager-version=%s\n' "$MANAGER_VERSION"
            printf 'collector-version=%s\n' "$COLLECTOR_VERSION"
            printf 'sensor-data-version=%s\n' "$SENSOR_DATA_VERSION"
            printf 'services=%s\n' "$(IFS=,; printf '%s' "${services[*]}")"
            printf 'manager=%s\n' "$(git -C manager rev-parse HEAD)"
            printf 'collector=%s\n' "$(git -C collector rev-parse HEAD)"
            printf 'sensor-data=%s\n' "$(git -C sensor-data rev-parse HEAD)"
          } > bundle/revisions.txt

      - name: Upload selected deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: dcim-selected-services-${{ github.run_id }}
          path: bundle/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Download verified bundle
        uses: actions/download-artifact@v4
        with:
          name: dcim-selected-services-${{ github.run_id }}
          path: bundle

      - name: Configure pinned SSH access
        env:
          CD_SSH_PRIVATE_KEY: ${{ secrets.CD_SSH_PRIVATE_KEY }}
          CD_KNOWN_HOSTS: ${{ vars.CD_KNOWN_HOSTS }}
        run: |
          test -n "$CD_SSH_PRIVATE_KEY"
          test -n "$CD_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$CD_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$CD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Transfer and deploy selected app JARs only
        env:
          CD_HOST: ${{ vars.CD_HOST }}
          CD_PORT: ${{ vars.CD_PORT }}
          CD_USER: ${{ vars.CD_USER }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$CD_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$CD_PORT" =~ ^[0-9]+$ ]]
          [[ "$CD_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -p "$CD_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          target="$CD_USER@$CD_HOST"
          ssh "${ssh_options[@]}" "$target" "mkdir -p /dcim_new/backend/.cd-incoming/$RELEASE_ID"
          scp -i "$HOME/.ssh/id_ed25519" -P "$CD_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            bundle/*.jar \
            bundle/revisions.txt \
            "$target:/dcim_new/backend/.cd-incoming/$RELEASE_ID/"
          ssh "${ssh_options[@]}" "$target" "bash -s -- '$RELEASE_ID'" < bundle/deploy-three-services.sh
